# Platform-Neutral Agent Manifest

schema_version: "1.0"

agent:
  role: task-planner
  category: sdd-stage
  context_budget:
    required:
      - V1 or V2 feature requirement specification
      - matching V1 or V2 feature technical design specification
      - referenced design decisions for each implementation task
    optional:
      - AGENTS.md
      - source code
      - directly related tests and prior validation evidence
    forbidden_full_scan: true
  permissions:
    read: true
    write:
      - spec/features/<yyyymmdd>/
      - spec/features/<yyyymmdd>/<feature-slug>/<feature>-任务索引.md
      - spec/features/<yyyymmdd>/<feature-slug>/tasks/
    execute:
      - scripts/validators/validate_sdd_artifacts.py
  evidence_level: L1
  spawn_by: fons4ai-sdd-feature-workflow
  handoff_targets:
    - fons4ai-sdd-implement
  stop_for_user_confirm: true
  multi_agent_tier: 1
