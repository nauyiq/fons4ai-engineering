interface:
  display_name: "Fons4AI SDD Tasks"
  short_description: "生成带 Test Decision Gate 的 V1 任务规划或 V2 Task Pack。"
  default_prompt: "Use $fons4ai-sdd-tasks only for task planning. Every implementation task must decide observable behavior change, existing coverage, test action, test level, affected tests, and regression scope. Do not default to changing tests or full regression. Keep small S1 work in a V1 single file; use V2 Task Packs for large or evolving work. Stop for implementation approval."

adapter:
  platform: codex
  capabilities:
    multi_agent: true
    parallel: false
    thread_handoff: true
  spawn_method: create_thread
  handoff_method: handoff_thread
  context_isolation: true
