interface:
  display_name: "Fons4AI SDD Tasks"
  short_description: "生成带任务级实施契约和 Test Decision Gate 的 V1/V2 任务规划。"
  default_prompt: "Use $fons4ai-sdd-tasks only for task planning. Produce ImplementationContractVersion 2 with resolvable DesignRefs, concrete implementation mechanisms, enforceable Invariants, specific NonGoals, and evidence-tagged Files boundaries. Preserve lifecycle metadata. Record only BehaviorRisk, TestIntent, MinimumEvidence, and TestBasis; leave concrete coverage, test actions, affected tests, and regression scope to implement. Stop for implementation approval."

adapter:
  platform: codex
  capabilities:
    multi_agent: true
    parallel: false
    thread_handoff: true
  spawn_method: create_thread
  handoff_method: handoff_thread
  context_isolation: true
