interface:
  display_name: "Fons4AI SDD Change"
  short_description: "处理已有内容变更：S0 直接修改；S1/S2 路由到基线修订、Change Task Pack、新或继任 Feature。"
  default_prompt: "Use $fons4ai-sdd-change for changes to existing functionality. Apply S0 first and perform a lightweight Test Decision: observable behavior, existing coverage, test action, test level, affected tests, and regression scope. Do not change tests for behavior-preserving work or default to full regression. For S1/S2, revise an unapproved baseline, create a CR with a dedicated Change Task Pack, or route independent/oversized work to a new or successor feature."

adapter:
  platform: codex
  capabilities:
    multi_agent: true
    parallel: false
    thread_handoff: true
  spawn_method: create_thread
  handoff_method: handoff_thread
  context_isolation: true
