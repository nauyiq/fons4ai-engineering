interface:
  display_name: "Fons4AI SDD Change"
  short_description: "处理已有内容变更：S0 直接修改验证，S1/S2 生成 CR 和增量任务。"
  default_prompt: "Use $fons4ai-sdd-change for changes to existing functionality and for low-risk non-bug edits such as documentation, configuration, styling, localized implementation changes, or behavior-preserving refactors. Apply the built-in S0 Fast Change gate first: execute and verify S0 directly without a CR; for S1/S2, generate a CR and incremental tasks, then stop for implementation approval."

adapter:
  platform: codex
  capabilities:
    multi_agent: true
    parallel: false
    thread_handoff: true
  spawn_method: create_thread
  handoff_method: handoff_thread
  context_isolation: true
