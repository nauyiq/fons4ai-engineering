# Platform-Neutral Agent Manifest

schema_version: "1.0"

agent:
  role: change-manager
  category: sdd-stage
  context_budget:
    required:
      - affected files or existing SDD feature directory
    optional:
      - AGENTS.md
      - .specify/memory/index.md
      - source code
    forbidden_full_scan: true
  permissions:
    read: true
    write:
      - spec/features/<yyyymmdd>/
      - scoped source files
      - scoped tests and configuration
    execute:
      - minimal verification commands for S0
      - SDD artifact validators for S1/S2
  evidence_level: L2
  spawn_by: null
  handoff_targets:
    - fons4ai-sdd-implement
  stop_for_user_confirm: conditional
  multi_agent_tier: 1
