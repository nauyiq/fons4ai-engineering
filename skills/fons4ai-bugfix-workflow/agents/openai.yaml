interface:
  display_name: "Fons4AI Bugfix Workflow"
  short_description: "BUG 风险分级工作流：S0 快速修复，复杂问题执行完整闭环。"
  default_prompt: "Use $fons4ai-bugfix-workflow for BUGs, exceptions, and regressions. Apply the built-in S0 Fast Fix gate first: directly fix and run focused verification for low-risk localized defects with established expected behavior, without a repository report. Use the standard evidence and report workflow for other defects, and route requirement changes to $fons4ai-sdd-change."

adapter:
  platform: codex
  capabilities:
    multi_agent: true
    parallel: true
    thread_handoff: true
  spawn_method: create_thread
  handoff_method: handoff_thread
  context_isolation: true
