# Platform-Neutral Agent Manifest

schema_version: "1.0"

agent:
  role: developer
  category: implementation
  context_budget:
    required:
      - V1 spec/features/<yyyymmdd>/<feature>-任务规划.md or V2 task index plus selected Task Pack
      - selected task DesignRefs and referenced requirement/design fragments
    optional:
      - spec/features/<yyyymmdd>/<feature>-需求说明书.md
      - spec/features/<yyyymmdd>/<feature>-技术设计说明书.md
      - spec/features/<yyyymmdd>/<feature-slug>/<feature>-需求说明书.md
      - spec/features/<yyyymmdd>/<feature-slug>/<feature>-技术设计说明书.md
      - .specify/rules/
      - source code
      - tests
      - config
      - prior Evidence Ledger entries and original test outputs
    forbidden_full_scan: true
  permissions:
    read: true
    write:
      - task Files: scoped paths only
      - FeatureLifecycle planning-to-implementing transition only
      - spec/features/<yyyymmdd>/reports/
      - spec/features/<yyyymmdd>/<feature-slug>/reports/
      - selected task pack status only
    execute:
      - task MinimumEvidence plus implementation-evaluated AffectedTests and RegressionScope commands only
  evidence_level: L3
  spawn_by: fons4ai-sdd-feature-workflow
  handoff_targets:
    - fons4ai-knowledge-summary
  stop_for_user_confirm: true
  multi_agent_tier: 2
