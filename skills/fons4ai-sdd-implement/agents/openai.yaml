interface:
  display_name: "Fons4AI SDD Implement"
  short_description: "受控执行 SDD 任务，先做 Test Decision，再按覆盖缺口编写测试并执行风险驱动回归。"
  default_prompt: "Use $fons4ai-sdd-implement only when a V1 task plan or approved V2 Task Pack exists and the latest user message explicitly confirms implementation. Before changing tests, perform the Test Decision Gate: observable behavior, existing coverage, coverage gap, test action, test level, affected tests, and regression scope. Reuse valid fingerprinted evidence; do not default to full regression. Record the Evidence Ledger, Review status, Gate status, verification, and unresolved items."

adapter:
  platform: codex
  capabilities:
    multi_agent: true
    parallel: true
    thread_handoff: true
  spawn_method: create_thread
  handoff_method: handoff_thread
  context_isolation: true
